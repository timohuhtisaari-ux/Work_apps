<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-Carbon Fuel CRM</title>
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E9EEEC;
  --ink:#1B2523; --ink2:#57645F; --ink3:#8B9793;
  --line:#D9E1DE; --line2:#C8D2CE;
  --accent:#0E6E63; --accent-ink:#0B5A51; --accent-soft:#DCEBE8;
  --crit:#B3261E; --crit-ink:#93251F; --crit-soft:#F6E0DE;
  --warn:#8F5B00; --warn-ink:#7A4E00; --warn-soft:#F4E7CB;
  --ok:#2E6B33; --ok-soft:#DFEDDE;
  --shadow:0 1px 2px rgba(20,30,28,.06),0 10px 30px rgba(20,30,28,.10);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1513; --surface:#171E1C; --surface2:#1F2825;
    --ink:#E6ECEA; --ink2:#A2AFAA; --ink3:#717E79;
    --line:#2A3430; --line2:#37423E;
    --accent:#57BFAE; --accent-ink:#7ED2C3; --accent-soft:#173F39;
    --crit:#E1837C; --crit-ink:#ECA09A; --crit-soft:#3E1E1B;
    --warn:#D8A94F; --warn-ink:#E4BC70; --warn-soft:#3A2E13;
    --ok:#82BE86; --ok-soft:#1D3320;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="light"]{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E9EEEC;
  --ink:#1B2523; --ink2:#57645F; --ink3:#8B9793;
  --line:#D9E1DE; --line2:#C8D2CE;
  --accent:#0E6E63; --accent-ink:#0B5A51; --accent-soft:#DCEBE8;
  --crit:#B3261E; --crit-ink:#93251F; --crit-soft:#F6E0DE;
  --warn:#8F5B00; --warn-ink:#7A4E00; --warn-soft:#F4E7CB;
  --ok:#2E6B33; --ok-soft:#DFEDDE;
  --shadow:0 1px 2px rgba(20,30,28,.06),0 10px 30px rgba(20,30,28,.10);
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#171E1C; --surface2:#1F2825;
  --ink:#E6ECEA; --ink2:#A2AFAA; --ink3:#717E79;
  --line:#2A3430; --line2:#37423E;
  --accent:#57BFAE; --accent-ink:#7ED2C3; --accent-soft:#173F39;
  --crit:#E1837C; --crit-ink:#ECA09A; --crit-soft:#3E1E1B;
  --warn:#D8A94F; --warn-ink:#E4BC70; --warn-soft:#3A2E13;
  --ok:#82BE86; --ok-soft:#1D3320;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 14.5px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,Menlo,monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:7px;padding:7px 10px;width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,tr[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;
}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 4px;}
a{color:var(--accent-ink)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 80px;}

/* ---------- header ---------- */
header.app{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 18px;}
.logo{width:38px;height:38px;flex:none;border-radius:9px;background:var(--accent);display:grid;place-items:center;}
.logo svg{display:block}
.titleblock .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);}
.titleblock h1{font-size:20px;font-weight:700;letter-spacing:-.01em;}
.spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 13px;
  font-weight:600;font-size:13.5px;border:1px solid var(--line2);background:var(--surface);
  color:var(--ink);white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06211D}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{color:#06211D} }
.btn.primary:hover{filter:brightness(1.06);color:#fff}
:root[data-theme="dark"] .btn.primary:hover{color:#06211D}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary:hover{color:#06211D} }
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{color:var(--accent-ink)}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:4px 0 20px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.kpi .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);}
.kpi .num{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;}
.kpi .sub{font-size:12px;color:var(--ink3);margin-top:1px}
.kpi.alert{border-color:var(--crit);background:var(--crit-soft)}
.kpi.alert .num,.kpi.alert .lbl{color:var(--crit-ink)}
.kpi.watch{border-color:var(--warn);background:var(--warn-soft)}
.kpi.watch .num,.kpi.watch .lbl{color:var(--warn-ink)}

/* ---------- tabs & toolbar ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.tab{padding:9px 16px 10px;font-weight:600;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}

/* ---------- tables ---------- */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:0 1px 2px rgba(20,30,28,.04);}
table{border-collapse:collapse;width:100%;min-width:860px;}
thead th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink2);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px;}
tbody tr:last-child td{border-bottom:none}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:hover td{background:var(--accent-soft)}
.cell-main{font-weight:650;font-size:14px}
.cell-sub{color:var(--ink2);font-size:12.5px;margin-top:1px}
.snippet{color:var(--ink2);max-width:260px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* pills & chips */
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.pill.active{background:var(--accent-soft);color:var(--accent-ink)}
.pill.prospect{background:var(--surface2);color:var(--ink2)}
.pill.onhold{background:var(--warn-soft);color:var(--warn-ink)}
.pill.dormant{background:var(--surface2);color:var(--ink3)}
.pill.neg{background:var(--accent);color:var(--surface)}
.pill.okpill{background:var(--ok-soft);color:var(--ok)}
.famchips{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.famchips button{font-size:12px;font-weight:700;color:var(--ink2);padding:5px 11px;border-radius:6px;white-space:nowrap}
.famchips button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.resultline{font-size:12.5px;color:var(--ink3);margin:0 0 8px;font-variant-numeric:tabular-nums}
.prodtag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin:2px 4px 0 0;white-space:nowrap}
.phasechips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.phasechips button{font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-variant-numeric:tabular-nums}
.phasechips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.stale{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn-ink);background:var(--warn-soft);border-radius:5px;padding:1px 6px;margin-left:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.chip.crit{background:var(--crit-soft);color:var(--crit-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.none{color:var(--ink3)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- empty state ---------- */
.empty{
  background:var(--surface);border:1px dashed var(--line2);border-radius:var(--radius);
  padding:52px 24px;text-align:center;color:var(--ink2);
}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 18px;font-size:13.5px}
.empty .btn{margin:0 5px}

/* ---------- slide-over panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;}
aside.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:50;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;
}
.panel-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line);}
.panel-head h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.panel-body{overflow-y:auto;padding:18px 20px 30px;flex:1}
.sect{margin-bottom:22px}
.sect > .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px;}
.card{background:var(--surface2);border-radius:9px;padding:12px 14px;font-size:13.5px;}
.card .row{display:flex;gap:8px;margin:3px 0}
.card .row .k{color:var(--ink2);width:82px;flex:none;font-size:12.5px;padding-top:1px}
.nextbox{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:11px 13px;font-size:13.5px;}
.nextbox.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.nextbox.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.logitem{border-left:2px solid var(--line2);padding:2px 0 10px 12px;margin-left:4px;position:relative;}
.logitem::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
.logitem .d{font-size:12px;font-weight:700;color:var(--ink2)}
.logitem p{margin:2px 0 0;font-size:13.5px;white-space:pre-wrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
.panel-actions{display:flex;gap:9px;flex-wrap:wrap;padding-top:4px}
.projchip{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:13px;}
.projchip .nm{font-weight:650}
.projchip .meta{color:var(--ink2);font-size:12px}

/* ---------- modal ---------- */
.modal{
  position:fixed;z-index:60;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(760px,calc(100vw - 32px));max-height:min(86vh,820px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
}
.modal.narrow{width:min(560px,calc(100vw - 32px))}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-head h2{font-size:16px;font-weight:700}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);}
.hint{font-size:12.5px;color:var(--ink3);margin:6px 0 0}
.codebox{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px;background:var(--surface2);border-radius:7px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--ink2);}

/* toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:calc(100vw - 40px);
}
#toast.show{opacity:1}
#toast.crit{background:var(--crit);color:#fff}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--ink2);font-variant-numeric:tabular-nums;}
.badge.crit{background:var(--crit);color:#fff}
.badge.warn{background:var(--warn-soft);color:var(--warn-ink)}
.remitem{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border-radius:9px;padding:11px 13px;margin-bottom:8px;}
.remitem .who{font-weight:650;font-size:13.5px}
.remitem .owner{font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px;white-space:nowrap;}
.remitem .task{color:var(--ink2);font-size:12.5px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.remitem .acts{display:flex;gap:6px;flex:none;padding-top:2px}
.iconbtn{padding:6px;border-radius:7px;color:var(--ink2);line-height:0}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.hidden{display:none !important}
@media (max-width:640px){
  .wrap{padding:14px 14px 70px}
  .formgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="7" cy="7" r="3.2" stroke="#fff" stroke-width="1.7"/>
        <circle cx="15.5" cy="11.5" r="2.6" stroke="#fff" stroke-width="1.7"/>
        <circle cx="8.5" cy="16" r="2.2" stroke="#fff" stroke-width="1.7"/>
        <path d="M9.6 9.2l3.4 1.4M9.3 13.9l1-1" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="titleblock">
      <div class="eyebrow">Low-carbon fuel follow-up &amp; monitoring</div>
      <h1>Low-Carbon Fuel CRM</h1>
    </div>
    <div class="spacer"></div>
    <button class="btn small" id="remindersBtn" data-action="open-reminders" title="Follow-ups that are due or late">Reminders</button>
    <button class="btn small" data-action="export-db" title="Download all CRM data as a JSON file">Export backup</button>
    <button class="btn small" data-action="restore-db" title="Restore CRM data from a JSON backup file">Restore backup</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <nav class="tabs" role="tablist">
    <button class="tab active" id="tab-producers" role="tab" data-action="tab" data-tab="producers">Producers</button>
    <button class="tab" id="tab-projects" role="tab" data-action="tab" data-tab="projects">Projects</button>
  </nav>

  <section id="view-producers">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search company, contact, country, notes…" aria-label="Search producers">
      <div class="famchips" role="group" aria-label="Filter by fuel family">
        <button data-action="family" data-fam="all" class="on">All</button>
        <button data-action="family" data-fam="efuel">E-fuels</button>
        <button data-action="family" data-fam="bio">Biofuels</button>
      </div>
      <select id="fProduct" aria-label="Filter by product"><option value="all">All products</option></select>
      <select id="fStatus" aria-label="Filter by stage">
        <option value="all">All stages</option>
        <option>Identified</option><option>Contacted</option><option>In dialogue</option>
        <option>Evaluation</option><option>Term negotiation</option><option>Agreement signed</option>
        <option>Paused / No fit</option>
      </select>
      <select id="fOwner" aria-label="Filter by responsible person"><option value="all">All responsible</option></select>
      <select id="fSort" aria-label="Sort producers">
        <option value="deadline">Sort: deadline first</option>
        <option value="lastdisc">Sort: longest silent first</option>
        <option value="company">Sort: company A–Z</option>
      </select>
      <div class="spacer"></div>
      <button class="btn small ghost" data-action="export-csv" data-kind="producers" title="Download the filtered list as CSV for Excel">⤓ CSV</button>
      <button class="btn primary" data-action="add-producer">+ Add producer</button>
    </div>
    <div id="producerList"></div>
  </section>

  <section id="view-projects" class="hidden">
    <div class="toolbar">
      <input type="search" id="pq" placeholder="Search project, producer, product…" aria-label="Search projects">
      <div class="famchips" role="group" aria-label="Filter by fuel family">
        <button data-action="family" data-fam="all" class="on">All</button>
        <button data-action="family" data-fam="efuel">E-fuels</button>
        <button data-action="family" data-fam="bio">Biofuels</button>
      </div>
      <select id="pProduct" aria-label="Filter by product"><option value="all">All products</option></select>
      <select id="pSort" aria-label="Sort projects">
        <option value="cod">Sort: COD year</option>
        <option value="capacity">Sort: largest first</option>
        <option value="name">Sort: project A–Z</option>
        <option value="producer">Sort: producer A–Z</option>
      </select>
      <div class="spacer"></div>
      <button class="btn small ghost" data-action="export-csv" data-kind="projects" title="Download the filtered list as CSV for Excel">⤓ CSV</button>
      <button class="btn" data-action="open-import">⤓ Import projects (JSON)</button>
      <button class="btn primary" data-action="project-new">+ Add project</button>
    </div>
    <div id="projectList"></div>
  </section>
</div>

<div id="layer"></div>
<div id="toast" role="status"></div>
<input type="file" id="restoreFile" accept=".json,application/json" class="hidden">
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
"use strict";
/* ================= storage ================= */
const LS_KEY = "efuelCRM.v1";
function migrateDB(d){
  // one-time move from the old flat status to pipeline stages (lossless: old value kept in p.status)
  for(const p of d.producers){
    if(!p.stage){
      if(p.status === "Active") p.stage = "In dialogue";
      else if(p.status === "On hold" || p.status === "Dormant") p.stage = "Paused / No fit";
      else p.stage = (p.discussions && p.discussions.length) ? "Contacted" : "Identified";
    }
  }
  return d;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.producers) && Array.isArray(d.projects)) return migrateDB(d);
    }
  }catch(e){}
  return {producers:[], projects:[]};
}
let db = loadDB();
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch(e){ toast("Could not save to browser storage", true); }
}

/* ================= helpers ================= */
const uid = () => "id" + Math.random().toString(36).slice(2,9) + Date.now().toString(36);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = id => document.getElementById(id);
const val = id => { const el = byId(id); return el ? el.value.trim() : ""; };
const todayISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + (iso.length === 10 ? "T00:00:00" : ""));
  if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
}
function daysUntil(iso){
  if(!iso) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return null;
  return Math.round((d - t) / 86400000);
}
function deadlineChip(iso){
  const n = daysUntil(iso);
  if(n === null) return '<span class="chip none">no deadline</span>';
  const date = fmtDate(iso);
  if(n < 0)  return `<span class="chip crit mono"><span class="dot"></span>${date} · ${-n} d overdue</span>`;
  if(n === 0) return `<span class="chip warn mono"><span class="dot"></span>due today</span>`;
  if(n <= 7) return `<span class="chip warn mono"><span class="dot"></span>${date} · in ${n} d</span>`;
  return `<span class="chip ok mono">${date}</span>`;
}
function lastDiscussion(p){
  if(!p.discussions || !p.discussions.length) return null;
  return p.discussions.slice().sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
}
function toast(msg, isErr){
  const t = byId("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " crit" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = "", 3200);
}

function producerMatches(p, q){
  if(!q) return true;
  const hay = [p.company, p.country, p.contactName, p.contactRole, p.email, p.phone, p.products, p.nextSteps, p.owner, p.notes,
    ...(p.discussions||[]).map(d => d.note)].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}
function refreshProductControls(){
  document.querySelectorAll(".famchips button").forEach(b => b.classList.toggle("on", b.dataset.fam === ui.family));
  const present = new Set();
  const idx = projectIndex();
  db.projects.forEach(pr => canonProducts(pr.product).forEach(c => present.add(c)));
  db.producers.forEach(p => canonProducts(p.products).forEach(c => present.add(c)));
  const opts = PRODUCTS.filter(pd => present.has(pd.name) && (ui.family === "all" || pd.family === ui.family));
  if(ui.product !== "all" && !opts.some(o => o.name === ui.product)) ui.product = "all";
  const group = fam => {
    const items = opts.filter(o => o.family === fam);
    return items.length ? `<optgroup label="${fam === "efuel" ? "E-fuels" : "Biofuels"}">${items.map(o => `<option value="${esc(o.name)}">${esc(o.name)}</option>`).join("")}</optgroup>` : "";
  };
  const html = '<option value="all">All products</option>' + group("efuel") + group("bio");
  for(const id of ["fProduct","pProduct"]){
    const sel = byId(id);
    if(sel.dataset.opts !== html){ sel.dataset.opts = html; sel.innerHTML = html; }
    sel.value = ui.product;
  }
  return idx;
}
function sortedProducers(idx){
  idx = idx || projectIndex();
  let list = db.producers.filter(p => producerMatches(p, ui.q)
    && (ui.stage === "all" || (p.stage||"Contacted") === ui.stage)
    && (ui.owner === "all" || (p.owner||"") === ui.owner)
    && productMatch(producerProducts(p, idx)));
  if(ui.sort === "company"){
    list.sort((a,b) => (a.company||"").localeCompare(b.company||""));
  } else if(ui.sort === "lastdisc"){
    list.sort((a,b) => {
      const da = lastDiscussion(a), dbb = lastDiscussion(b);
      return (da ? da.date : "0000").localeCompare(dbb ? dbb.date : "0000");
    });
  } else {
    list.sort((a,b) => {
      const na = daysUntil(a.deadline), nb = daysUntil(b.deadline);
      if(na === null && nb === null) return (a.company||"").localeCompare(b.company||"");
      if(na === null) return 1;
      if(nb === null) return -1;
      return na - nb;
    });
  }
  return list;
}
function ownerList(){
  return [...new Set(db.producers.map(p => (p.owner||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
}
function refreshOwnerFilter(){

  sel.value = ui.owner;
}

const PRODUCT_FAMILY = {}; PRODUCTS.forEach(p => PRODUCT_FAMILY[p.name] = p.family);
const PRODUCT_ALIASES = {
  h2:"Renewable H2", hydrogen:"Renewable H2", greenh2:"Renewable H2", greenhydrogen:"Renewable H2",
  renewableh2:"Renewable H2", rfnbohydrogen:"Renewable H2", rfnboh2:"Renewable H2", electrolytich2:"Renewable H2",
  emethanol:"e-Methanol",
  eammonia:"e-Ammonia", greenammonia:"e-Ammonia",
  esaf:"e-SAF", ekerosene:"e-SAF", ptlsaf:"e-SAF", ejetfuel:"e-SAF", ptl:"e-SAF",
  emethane:"e-Methane", elng:"e-Methane", sng:"e-Methane",
  ediesel:"e-Diesel", egasoline:"e-Diesel", eliquids:"e-Diesel", efuels:"e-Diesel",
  biomethanol:"Bio-methanol",
  biosaf:"Bio-SAF (HEFA/AtJ)", hefa:"Bio-SAF (HEFA/AtJ)", atj:"Bio-SAF (HEFA/AtJ)", hefasaf:"Bio-SAF (HEFA/AtJ)",
  hvo:"HVO / renewable diesel", renewablediesel:"HVO / renewable diesel", hdrd:"HVO / renewable diesel",
  biomethane:"Biomethane / bio-LNG", biogas:"Biomethane / bio-LNG", biolng:"Biomethane / bio-LNG", rng:"Biomethane / bio-LNG",
  ethanol:"Ethanol", bioethanol:"Ethanol",
  biodiesel:"Biodiesel (FAME)", fame:"Biodiesel (FAME)"
};
const DISPLAY_ALIASES = {eh2diesel:"Green H2 / e-Diesel", greenh2ediesel:"Green H2 / e-Diesel"};
const normTok = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function canonProduct(token){
  const key = normTok(token);
  if(!key) return null;
  if(PRODUCT_ALIASES[key]) return PRODUCT_ALIASES[key];
  for(const p of PRODUCTS) if(normTok(p.name) === key) return p.name;
  return null;
}
function canonProducts(text){
  const out = new Set();
  String(text||"").split(/[,;\/+&·]|\band\b/i).forEach(t => { const c = canonProduct(t); if(c) out.add(c); });
  return out;
}
function prettyFuel(s){
  return DISPLAY_ALIASES[normTok(s)] || canonProduct(s) || String(s||"");
}
function projectIndex(){
  const idx = {};
  for(const pr of db.projects) if(pr.producerId) (idx[pr.producerId] = idx[pr.producerId] || []).push(pr);
  return idx;
}
function producerProducts(p, idx){
  const set = canonProducts(p.products);
  const linked = idx ? (idx[p.id] || []) : db.projects.filter(x => x.producerId === p.id);
  for(const pr of linked) canonProducts(pr.product).forEach(c => set.add(c));
  return set;
}
function productMatch(set){
  if(ui.product !== "all") return set.has(ui.product);
  if(ui.family !== "all") return [...set].some(c => PRODUCT_FAMILY[c] === ui.family);
  return true;
}
const STAGES = ["Identified","Contacted","In dialogue","Evaluation","Term negotiation","Agreement signed","Paused / No fit"];
function stagePill(s){
  const cls = {"Identified":"prospect","Contacted":"prospect","In dialogue":"active","Evaluation":"active",
               "Term negotiation":"neg","Agreement signed":"okpill","Paused / No fit":"dormant"}[s] || "prospect";
  return `<span class="pill ${cls}">${esc(s || "Contacted")}</span>`;
}
function mapModelRow(o){
  if(typeof o !== "object" || o === null || Array.isArray(o)) return null;
  const name = pickField(o, ["project","projectname","name","title","plant","plantname"]);
  if(!name) return null;
  return {
    sel: true,
    name: String(name),
    producer: String(pickField(o, ["producer","company","developer","owner","sponsor","operator"]) ?? ""),
    country:  String(pickField(o, ["country","location","region","site"]) ?? ""),
    product:  prettyFuel(pickField(o, ["product","fuel","output","producttype","fueltype","endproduct"]) ?? ""),
    capacity: pickField(o, ["capacitykta","capacityktpa","capacityktperyear","capacityktyr","capacity","annualcapacity","capacitykt","outputkta","productionkta"]),
    electrolyzerMW: pickField(o, ["electrolyzermw","electrolysermw","electrolyzercapacitymw","electrolysercapacitymw","electrolyzercapacity","electrolysercapacity","mwel","mw"]),
    cod:   pickField(o, ["cod","codyear","startyear","startup","startupyear","operational","operationalyear","commissioning"]),
    phase: String(pickField(o, ["phase","status","stage","maturity","developmentphase"]) ?? ""),
    notes: String(pickField(o, ["notes","note","comment","comments","description","remarks"]) ?? "")
  };
}
function parseModelJSON(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error("Not valid JSON: " + e.message); }
  let rows = Array.isArray(data) ? data
           : Array.isArray(data.projects) ? data.projects
           : Array.isArray(data.rows) ? data.rows
           : Array.isArray(data.data) ? data.data
           : [data];
  const mapped = rows.map(mapModelRow).filter(Boolean);
  if(!mapped.length) throw new Error("No projects recognized. Each project needs at least a “project” / “name” field.");
  return mapped;
}
function findProducerByName(name){
  const n = (name||"").trim().toLowerCase();
  if(!n) return null;
  return db.producers.find(p => (p.company||"").trim().toLowerCase() === n) || null;
}

/* ================= reminders ================= */
function reminderBuckets(){
  const overdue = [], today = [], week = [];
  for(const p of db.producers){
    const n = daysUntil(p.deadline);
    if(n === null) continue;
    if(n < 0) overdue.push(p);
    else if(n === 0) today.push(p);
    else if(n <= 7) week.push(p);
  }
  const byDate = (a,b) => (a.deadline||"").localeCompare(b.deadline||"");
  overdue.sort(byDate); week.sort(byDate);
  today.sort((a,b) => (a.company||"").localeCompare(b.company||""));
  return {overdue, today, week};
}
function reminderItem(p){
  return `<div class="remitem">
    <div style="flex:1;min-width:0">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="who">${esc(p.company)}</span>
        ${p.owner ? `<span class="owner">${esc(p.owner)}</span>` : ""}
        ${deadlineChip(p.deadline)}
      </div>
      <div class="task">${esc(p.nextSteps || "No next step written down — open the producer and add one.")}</div>
    </div>
    <div class="acts">

      <button class="btn small ghost" data-action="snooze" data-id="${p.id}" title="Move the deadline one week forward">+1 wk</button>
    </div>
  </div>`;
}
function remindersModalHTML(){

  const group = (title, arr, emptyText) => `<div class="sect" style="margin-bottom:16px">
    <div class="eyebrow">${title} (${arr.length})</div>
    ${arr.length ? arr.map(reminderItem).join("") : `<div class="cell-sub">${emptyText}</div>`}</div>`;
  return `<div class="scrim" data-action="close-modal"></div>
  <div class="modal narrow" role="dialog" aria-modal="true" aria-label="Reminders">
    <div class="modal-head"><h2>Reminders — due &amp; late follow-ups</h2>

    <div class="modal-body">

      <p class="hint">Reminders come from each producer's next-step deadline. "+1 wk" postpones the deadline; "Open" takes you to the producer to log the outcome and set the next step.</p>
    </div>
    <div class="modal-foot">
      <button class="btn small" data-action="export-ics" title="Download upcoming deadlines as calendar events with a 09:00 reminder">Export deadlines to calendar (.ics)</button>
      <div class="spacer"></div>
      <button class="btn" data-action="close-modal">Close</button>
    </div>
  </div>`;

function renderRemindersBtn(){
  const {overdue, today, week} = reminderBuckets();
  const n = overdue.length + today.length;
  const badge = overdue.length ? `<span class="badge crit">${n}</span>`
              : n ? `<span class="badge warn">${n}</span>`
              : week.length ? `<span class="badge">${week.length}</span>` : "";
  byId("remindersBtn").innerHTML = "🔔 Reminders " + badge;
}
function icsEscape(s){ return String(s??"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function exportICS(){
  const items = db.producers.filter(p => { const n = daysUntil(p.deadline); return n !== null && n >= 0; })
    .sort((a,b) => a.deadline.localeCompare(b.deadline));
  if(!items.length){ toast("No upcoming deadlines to export", true); return; }
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//efuel-crm//deadlines//EN","CALSCALE:GREGORIAN"];
  for(const p of items){
    const d = p.deadline.replace(/-/g,"");
    lines.push("BEGIN:VEVENT",
      `UID:${p.id}-${d}@efuel-crm`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d}`,
      `SUMMARY:${icsEscape("Follow up: " + p.company + (p.owner ? " (" + p.owner + ")" : ""))}`,
      `DESCRIPTION:${icsEscape((p.nextSteps || "Follow up with " + p.company) + (p.contactName ? "\nContact: " + p.contactName + (p.email ? " <" + p.email + ">" : "") : ""))}`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEscape("Follow up: " + p.company)}`,"TRIGGER:PT9H","END:VALARM",
      "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], {type: "text/calendar"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "efuel-crm-deadlines.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`${items.length} deadline${items.length === 1 ? "" : "s"} exported — import the file into your calendar`);
}

function runImport(){
  const rows = (ui.importRows || []).filter(r => r.sel);
  let created = 0;
  for(const r of rows){
    let producerId = null;
    if(r.producer){
      let p = findProducerByName(r.producer);
      if(!p){
        p = {id: uid(), company: r.producer.trim(), country: r.country || "", stage: "Identified",
             contactName:"", contactRole:"", email:"", phone:"", products: r.product || "",
             nextSteps:"", deadline:"", notes:"Created via project JSON import", discussions:[]};
        db.producers.push(p); created++;
      }
      producerId = p.id;
    }
    db.projects.push({
      id: uid(), name: r.name, producerId, country: r.country, product: r.product,
      capacity: r.capacity != null ? r.capacity : null,
      electrolyzerMW: r.electrolyzerMW != null ? r.electrolyzerMW : null,
      cod: r.cod != null ? String(r.cod) : "", phase: r.phase, notes: r.notes
    });
  }
  ui.modal = null; ui.importRows = null; ui.tab = "projects";
  save(); render();
  toast(`Imported ${rows.length} project${rows.length === 1 ? "" : "s"}${created ? ` · created ${created} new producer${created === 1 ? "" : "s"}` : ""}`);
}
function csvCell(v){ return '"' + String(v ?? "").replace(/"/g,'""') + '"'; }
function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCSV(kind){
  let rows;
  if(kind === "producers"){
    const idx = projectIndex();
    rows = [["Company","Country","Stage","Responsible","Contact","Role","Email","Phone","Products","Last discussion","Last discussion note","Next steps","Deadline","Projects"]];
    for(const p of sortedProducers(idx)){
      const ld = lastDiscussion(p);
      rows.push([p.company, p.country, p.stage, p.owner, p.contactName, p.contactRole, p.email, p.phone,
        [...producerProducts(p, idx)].join("; ") || p.products || "",
        ld ? ld.date : "", ld ? ld.note : "", p.nextSteps, p.deadline, (idx[p.id]||[]).map(x => x.name).join("; ")]);
    }
  } else {
    rows = [["Project","Producer","Country","Product","Capacity kt/a","Electrolyzer MW","COD","Phase","Notes"]];
    for(const pr of filteredProjects())
      rows.push([pr.name, producerName(pr.producerId) || "", pr.country, pr.product, pr.capacity, pr.electrolyzerMW, pr.cod, pr.phase, pr.notes]);
  }
  const csv = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  downloadBlob(new Blob([csv], {type:"text/csv;charset=utf-8"}), `lowcarbon-crm-${kind}-${todayISO()}.csv`);
  toast(`${rows.length - 1} row${rows.length === 2 ? "" : "s"} exported as CSV (respects active filters)`);
}
function markDone(id){
  const p = db.producers.find(x => x.id === id); if(!p) return;
  const note = p.nextSteps ? "✔ Done: " + p.nextSteps : "✔ Follow-up completed";
  (p.discussions = p.discussions || []).push({id: uid(), date: todayISO(), note});
  p.nextSteps = ""; p.deadline = "";
  ui.panelId = p.id; ui.panelEdit = true; ui.modal = null; ui.importRows = null;
  save(); render();
  const el = byId("f_nextSteps"); if(el) el.focus();
  toast("Logged as done — write the next step and deadline");
}
function panelDirty(){
  if(!ui.panelEdit) return false;
  const p = db.producers.find(x => x.id === ui.panelId) || {};
  const fields = {company:"f_company", country:"f_country", contactName:"f_contactName", contactRole:"f_contactRole",
    email:"f_email", phone:"f_phone", products:"f_products", owner:"f_owner", nextSteps:"f_nextSteps",
    deadline:"f_deadline", notes:"f_notes"};
  for(const k in fields){
    const el = byId(fields[k]);
    if(el && (el.value || "").trim() !== String(p[k] || "").trim()) return true;
  }
  const st = byId("f_stage");
  if(st && p.id && st.value !== (p.stage || "Contacted")) return true;
  return false;
}
function exportDB(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "efuel-crm-backup-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Backup downloaded");
}

/* ================= event wiring ================= */
document.addEventListener("click", (e) => {
  if(e.target.closest("a[href]")) return; // let mailto/links work without triggering the row
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  if(a !== "del-producer" && a !== "project-del") ui.deleteArmed = null;
  if(a !== "close-panel") ui.closeArmed = null;
  switch(a){
    case "tab": ui.tab = el.dataset.tab; render(); break;
    case "family": ui.family = el.dataset.fam; renderProducers(); renderProjects(); break;
    case "phase": ui.phase = el.dataset.ph; renderProjects(); break;
    case "export-csv": exportCSV(el.dataset.kind); break;
    case "mark-done": markDone(id); break;
    case "add-producer": ui.panelId = null; ui.panelEdit = true; render(); byId("f_company") && byId("f_company").focus(); break;
    case "open-producer": ui.panelId = id; ui.panelEdit = false; ui.modal = null; ui.importRows = null; render(); break;
    case "open-reminders": ui.modal = "reminders"; render(); break;
    case "snooze": {
      const p = db.producers.find(x => x.id === id); if(!p || !p.deadline) break;
      const base = daysUntil(p.deadline) < 0 ? new Date() : new Date(p.deadline + "T00:00:00");
      base.setDate(base.getDate() + 7);
      p.deadline = base.getFullYear() + "-" + String(base.getMonth()+1).padStart(2,"0") + "-" + String(base.getDate()).padStart(2,"0");
      save(); render(); toast(`${p.company}: deadline moved to ${fmtDate(p.deadline)}`);
      break;
    }
    case "export-ics": exportICS(); break;
    case "close-panel": {
      if(panelDirty() && ui.closeArmed !== "panel"){
        ui.closeArmed = "panel";
        toast("Unsaved changes — close again to discard them", true);
        break;
      }
      ui.closeArmed = null; ui.panelId = null; ui.panelEdit = false; render(); break;
    }
    case "edit-producer": ui.panelEdit = true; render(); break;
    case "cancel-edit": ui.panelEdit = false; render(); break;
    case "save-producer": saveProducerForm(); break;
    case "del-producer": {
      if(ui.deleteArmed === id){
        db.projects.forEach(pr => { if(pr.producerId === id) pr.producerId = null; });
        db.producers = db.producers.filter(p => p.id !== id);
        ui.panelId = null; ui.deleteArmed = null;
        save(); render(); toast("Producer deleted — its projects were kept, unlinked");
      } else { ui.deleteArmed = id; render(); }
      break;
    }
    case "log-discussion": {
      const p = db.producers.find(x => x.id === id); if(!p) break;
      const note = val("d_note");
      if(!note){ toast("Write a short summary first", true); byId("d_note").focus(); break; }
      (p.discussions = p.discussions || []).push({id: uid(), date: val("d_date") || todayISO(), note});
      save(); render(); toast("Discussion logged");
      break;
    }
    case "del-discussion": {
      const p = db.producers.find(x => x.id === id); if(!p) break;
      p.discussions = (p.discussions || []).filter(l => l.id !== el.dataset.log);
      save(); render();
      break;
    }
    case "project-new": ui.modal = "project"; ui.projectId = null; ui.projectPresetProducer = el.dataset.producer || null; render(); break;
    case "project-edit": ui.modal = "project"; ui.projectId = id; ui.projectPresetProducer = null; render(); break;
    case "project-save": saveProjectForm(); break;
    case "project-del": {
      if(ui.deleteArmed !== id){ ui.deleteArmed = id; renderProjects(); break; }
      const pr = db.projects.find(x => x.id === id);
      db.projects = db.projects.filter(x => x.id !== id);
      ui.deleteArmed = null;
      save(); render(); toast(`Deleted “${pr ? pr.name : "project"}”`);
      break;
    }
    case "open-import": ui.modal = "import"; render(); break;
    case "import-example": byId("importText").value = EXAMPLE_JSON; break;
    case "import-upload": byId("importFile").click(); break;
    case "import-parse": {
      try{
        const text = val("importText");
        if(!text){ toast("Paste JSON or upload a file first", true); break; }
        ui.importRows = parseModelJSON(text);
        ui.modal = "import-preview"; render();
      }catch(err){ toast(err.message, true); }
      break;
    }
    case "import-toggle": ui.importRows[Number(el.dataset.idx)].sel = el.checked; render(); break;
    case "import-back": ui.modal = "import"; render(); break;
    case "import-run": runImport(); break;
    case "close-modal": ui.modal = null; ui.importRows = null; ui.projectId = null; ui.projectPresetProducer = null; ui.pendingRestore = null; render(); break;
    case "export-db": exportDB(); break;
    case "restore-db": byId("restoreFile").click(); break;
    case "restore-confirm": {
      if(ui.pendingRestore){ db = migrateDB(ui.pendingRestore); ui.pendingRestore = null; ui.modal = null; save(); render(); toast("Backup restored"); }
      break;
    }
    case "sample-data": loadSample(); break;
  }
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    if(ui.modal){ ui.modal = null; ui.importRows = null; ui.pendingRestore = null; render(); }
    else if(ui.panelId !== null || ui.panelEdit){
      if(panelDirty() && ui.closeArmed !== "panel"){
        ui.closeArmed = "panel";
        toast("Unsaved changes — press Esc again to discard them", true);
      } else { ui.closeArmed = null; ui.panelId = null; ui.panelEdit = false; render(); }
    }
  }
  if(e.key === "Enter" && e.target.matches && e.target.matches("tr.rowlink, .kpi[data-action]")){
    e.target.click();
  }
});
byId("q").addEventListener("input", e => { ui.q = e.target.value.trim(); renderProducers(); });
byId("pq").addEventListener("input", e => { ui.pq = e.target.value.trim(); renderProjects(); });
byId("fStatus").addEventListener("change", e => { ui.stage = e.target.value; renderProducers(); });
byId("fOwner").addEventListener("change", e => { ui.owner = e.target.value; renderProducers(); });
byId("fSort").addEventListener("change", e => { ui.sort = e.target.value; renderProducers(); });
byId("fProduct").addEventListener("change", e => { ui.product = e.target.value; renderProducers(); renderProjects(); });
byId("pProduct").addEventListener("change", e => { ui.product = e.target.value; renderProducers(); renderProjects(); });
byId("pSort").addEventListener("change", e => { ui.psort = e.target.value; renderProjects(); });
byId("importFile").addEventListener("change", (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      ui.importRows = parseModelJSON(String(r.result));
      ui.modal = "import-preview"; render();
    }catch(err){ toast(err.message, true); }
  };
  r.readAsText(f);
});
byId("restoreFile").addEventListener("change", (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(String(r.result));
      if(!d || !Array.isArray(d.producers) || !Array.isArray(d.projects)) throw new Error("Not a valid CRM backup file");
      ui.pendingRestore = d; ui.modal = "confirm-restore"; render();
    }catch(err){ toast(err.message, true); }
  };
  r.readAsText(f);
});

render();
{ // one nudge per day if follow-ups are due or late
  const {overdue, today} = reminderBuckets();
  const n = overdue.length + today.length;
  if(n){
    let last = null;
    try{ last = localStorage.getItem("efuelCRM.nudge"); }catch(e){}
    if(last !== todayISO()){
      try{ localStorage.setItem("efuelCRM.nudge", todayISO()); }catch(e){}
      toast(`${n} follow-up${n === 1 ? " is" : "s are"} due or late — see Reminders`, overdue.length > 0);
    }
  }
}
</script>
